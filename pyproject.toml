[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


requires-python = ">=3.13"
dependencies = [
]

[tool.poetry.group.lint.dependencies]
flake8 = "^7.2.0"
mypy = "^1.16.0"
black = "^25.1.0"
isort = "^6.0.1"

[tool.black]
line-length = 119
target-version = ["py311"]
exclude = '''/(\.git)/'''


[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = '''
/(
    venv
  | \.venv
)/
'''